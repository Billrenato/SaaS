{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h3 class="fw-bold text-primary mb-3">Criar Nova Conta</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">Finalizar Cadastro</button>
                </form>
                <div class="mt-3 text-center">
                    <a href="{% url 'login' %}" class="text-decoration-none">Já tem uma conta? Faça login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
